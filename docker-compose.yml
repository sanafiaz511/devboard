services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: devboard_app
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:latest
    container_name: devboard_nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  postgres:
    image: postgres:17
    container_name: devboard_postgres
    restart: always
    environment:
      POSTGRES_DB: devboard
      POSTGRES_USER: devboard_user
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: devboard_redis
    ports:
      - "6379:6379"

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: devboard_reverb
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    depends_on:
      - redis
      
volumes:
  postgres_data: